    - data:
        code: "import json\nimport re\n\ndef parse_source(body, default_ats):\n  \
          \  if not body:\n        return []\n    try:\n        data = json.loads(body)\
          \ if isinstance(body, str) else body\n        if isinstance(data, list):\n\
          \            res = []\n            for idx, j in enumerate(data):\n    \
          \            if isinstance(j, dict) and j.get(\"title\"):\n            \
          \        res.append({\n                        \"job_id\": str(j.get(\"\
          job_id\") or f\"{default_ats}:{idx}\"),\n                        \"company\"\
          : str(j.get(\"company\") or default_ats.capitalize()),\n               \
          \         \"title\": str(j.get(\"title\") or \"\"),\n                  \
          \      \"location\": str(j.get(\"location\") or \"Remote\"),\n         \
          \               \"url\": str(j.get(\"url\") or \"\"),\n                \
          \        \"description\": str(j.get(\"description\") or \"\")[:1200],\n\
          \                        \"source\": default_ats.capitalize(),\n       \
          \             })\n            return res\n        elif isinstance(data,\
          \ dict):\n            res = []\n            for idx, j in enumerate(data.get(\"\
          jobs\", [])):\n                loc_raw = j.get(\"location\")\n         \
          \       loc = loc_raw.get(\"name\", \"Remote\") if isinstance(loc_raw, dict)\
          \ else str(loc_raw or \"Remote\")\n                res.append({\n      \
          \              \"job_id\": f\"{default_ats}:{j.get('id', idx)}\",\n    \
          \                \"company\": default_ats.capitalize(),\n              \
          \      \"title\": str(j.get(\"title\") or \"\"),\n                    \"\
          location\": loc,\n                    \"url\": str(j.get(\"absolute_url\"\
          ) or j.get(\"jobUrl\") or \"\"),\n                    \"description\": str(j.get(\"\
          descriptionPlain\") or j.get(\"title\") or \"\")[:1200],\n             \
          \       \"source\": default_ats.capitalize(),\n                })\n    \
          \        return res\n    except Exception:\n        pass\n    return []\n\
          \nraw_jobs = []\nraw_jobs.extend(parse_source(gh_body, \"greenhouse\"))\n\
          raw_jobs.extend(parse_source(lv_body, \"lever\"))\nraw_jobs.extend(parse_source(ash_body,\
          \ \"ashby\"))\nraw_jobs.extend(parse_source(li_body, \"linkedin\"))\nraw_jobs.extend(parse_source(x_body,\
          \ \"x\"))\n\n# Config.yaml regex patterns (tuned for Fresher / 0-1 Year\
          \ Experience)\nkw_terms = [k.strip() for k in target_keywords.split(\",\"\
          ) if k.strip()] if target_keywords else [\n    \"sde\", \"sde 1\", \"software\
          \ engineer\", \"backend\", \"full stack\", \"junior\", \"intern\", \"associate\"\
          \n]\nkw_pattern = \"|\".join(re.escape(k) for k in kw_terms)\ninc_pat =\
          \ re.compile(rf\"(?i)\\b({kw_pattern})\\b\")\n\n# Exclude patterns: senior\
          \ tiers and non-engineering operations (KEEP interns and freshers!)\nexc_pat\
          \ = re.compile(\n    r\"(?i)\\b(\"\n    r\"staff|principal|distinguished|fellow|architect|senior|director|vp|vice\
          \ president|head of|chief|cto|manager|management|lead|\"\n    r\"sde\\s*[-_\
          \ ]*(2|3|4|ii|iii|iv)|software engineer\\s*[-_ ]*(2|3|ii|iii)|swe\\s*[-_\
          \ ]*(2|3|ii|iii)|\"\n    r\"people operations|human resources|\\bhr\\b|talent|recruiter|recruiting|sourcer|\"\
          \n    r\"administrator|admin|sysadmin|systems admin|\"\n    r\"sales|account\
          \ executive|marketing|finance|payroll|accounting|legal|compliance|procurement|\"\
          \n    r\"customer support|tech support|desktop support|helpdesk\"\n    r\"\
          )\\b\"\n)\n\n# Locations from config.yaml\nloc_list = [l.strip().lower()\
          \ for l in target_location.split(\",\") if l.strip()] if target_location\
          \ and target_location.lower() not in (\"all\", \"any\") else [\n    \"bangalore\"\
          , \"bengaluru\", \"pune\", \"hyderabad\", \"india\"\n]\n\npassed = []\n\
          for j in raw_jobs:\n    title = j.get(\"title\", \"\")\n    loc = j.get(\"\
          location\", \"\").lower()\n    hay = f\"{loc} {title.lower()}\"\n    if\
          \ not inc_pat.search(title):\n        continue\n    if exc_pat and exc_pat.search(title):\n\
          \        continue\n    if loc_list and not any(l in hay for l in loc_list):\n\
          \        continue\n    passed.append(j)\n\nreturn {\n    \"total_fetched\"\
          : len(raw_jobs),\n    \"passed_count\": len(passed),\n    \"candidate_jobs\"\
          : json.dumps(passed[:12])\n}\n"
        code_language: python3
        desc: Multi-source deterministic prefilter combining Greenhouse, Lever, Ashby,
          LinkedIn, and X
        outputs:
          candidate_jobs:
            type: string
          passed_count:
            type: number
          total_fetched:
            type: number
        selected: false
