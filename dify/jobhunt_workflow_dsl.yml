        desc: ''
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: gpt-4o-mini
          provider: openai
        prompt_template:
        - id: prompt_screen_sys
          role: system
          text: 'You screen job postings for one candidate: a Fresher / Early Career
            Engineer (0-1 YOE, currently Full-stack Engineer Intern, MCA student,
            stack: TypeScript, Python, Go, Node.js, React, PostgreSQL).


            SCORING GUIDELINES (0-10):

            - 8-10: Strong match for a Fresher, SDE 1, Junior, Associate, or Intern
            role matching candidate stack (TypeScript/Python/Go/Full-Stack/Backend).

            - 6-7: Plausible entry-level role, worth applying.

            - 0-4: Seniority mismatch (roles demanding 3+ years experience, Senior/Staff/Lead),
            wrong stack, or non-engineering roles (Operations/HR/Admin).


            Penalize roles demanding 3+ years of experience heavily (score <= 4.0).

            Reward genuine 0-1 YOE, SDE-1, and Intern opportunities.

            Return ONLY a valid JSON array, one object per job:

            [{"job_id": "...", "score": 8.5, "reason": "1-sentence deciding factor
            max 20 words"}]

            '
        - id: prompt_screen_user
          role: user
          text: 'CANDIDATE PROFILE:

            {{#env.CANDIDATE_PROFILE#}}


            JOBS TO EVALUATE:

            {{#prefilter_code.candidate_jobs#}}

            '
        selected: false
        title: Strict LLM Screening
        type: llm
        vision:
          enabled: false
      height: 98
      id: screen_llm
      position:
        x: 2180
        y: 280
      positionAbsolute:
        x: 2180
        y: 280
      sourcePosition: right
      targetPosition: left
