app:
  description: Autonomous job hunting workflow for Greenhouse, Lever, Ashby, LinkedIn,
    and X. Features multi-source fetching, deterministic regex pre-filtering (zero-cost),
    strict LLM resume screening, tailored application drafting (bullets + cover notes),
    and automated application submitter.
  icon: 🦞
  icon_background: '#FFEAD5'
  mode: workflow
  name: JobHunt AI Workflow
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables:
  - description: Candidate profile JSON
    id: env_candidate_profile
    name: CANDIDATE_PROFILE
    value: '{"name":"Kartik Dewnani","current_title":"Full-stack Engineer Intern","years_experience":0.5,"core_skills":["TypeScript","JavaScript","Node.js","Python","PostgreSQL","React","Next.js","Docker","Go","FastAPI","React
      Native","MySQL","Redis","RAG Pipelines","LLM Integration"],"domains":["full-stack
      development","backend engineering","mobile app development","AI / LLM integration","distributed
      systems"],"education":"MCA, CHRIST University (2025-2027)","target_titles":["Full-Stack
      Engineer","Backend Engineer","Software Development Engineer (SDE I)","Software
      Engineer Intern"],"seniority":"intern"}'
    value_type: string
  - description: Minimum score (0-10) to qualify for drafting
    id: env_score_threshold
    name: SCORE_THRESHOLD
    value: '7.0'
    value_type: string
  - description: Bridge API URL for reverse-engineered LinkedIn and X collectors
    id: env_bridge_api_url
    name: BRIDGE_API_URL
    value: https://partially-pictures-gotta-birmingham.trycloudflare.com
    value_type: string
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods:
      - remote_url
      - local_file
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - remote_url
        - local_file
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
      id: edge_start_to_gh
      source: start_node
      sourceHandle: source
      sourceType: start
      target: fetch_greenhouse
      targetHandle: target
      targetType: http-request
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
      id: edge_gh_to_lv
      source: fetch_greenhouse
      sourceHandle: source
      sourceType: http-request
      target: fetch_lever
      targetHandle: target
      targetType: http-request
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
      id: edge_lv_to_ash
      source: fetch_lever
      sourceHandle: source
      sourceType: http-request
      target: fetch_ashby
      targetHandle: target
      targetType: http-request
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
      id: edge_ash_to_li
      source: fetch_ashby
      sourceHandle: source
      sourceType: http-request
      target: fetch_linkedin
      targetHandle: target
      targetType: http-request
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
      id: edge_li_to_x
      source: fetch_linkedin
      sourceHandle: source
      sourceType: http-request
      target: fetch_x
      targetHandle: target
      targetType: http-request
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
      id: edge_x_to_prefilter
      source: fetch_x
      sourceHandle: source
      sourceType: http-request
      target: prefilter_code
      targetHandle: target
      targetType: code
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
      id: edge_prefilter_to_screen
      source: prefilter_code
      sourceHandle: source
      sourceType: code
      target: screen_llm
      targetHandle: target
      targetType: llm
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
      id: edge_screen_to_draft
      source: screen_llm
      sourceHandle: source
      sourceType: llm
      target: draft_llm
      targetHandle: target
      targetType: llm
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
      id: edge_draft_to_digest
      source: draft_llm
      sourceHandle: source
      sourceType: llm
      target: format_digest
      targetHandle: target
      targetType: code
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
      id: edge_digest_to_apply
      source: format_digest
      sourceHandle: source
      sourceType: code
      target: send_email
      targetHandle: target
      targetType: http-request
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
      id: edge_apply_to_end
      source: apply_action
      sourceHandle: source
      sourceType: http-request
      target: end_node
      targetHandle: target
      targetType: end
      type: custom
      zIndex: 0
    - id: edge_email_to_apply
      source: send_email
      sourceHandle: source
      sourceType: http-request
      target: apply_action
      targetHandle: target
      targetType: http-request
      type: custom
      zIndex: 0
      data:
        isInIteration: false
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables:
        - label: Greenhouse Companies (from companies.yaml)
          max_length: 250
          options: []
          required: false
          type: text-input
          variable: greenhouse_companies
          default: stripe, databricks, figma, dropbox, coinbase, reddit, razorpaysoftwareprivatelimited,
            postman, cloudflare, abnormalsecurity, discord
        - label: Lever Companies (from companies.yaml)
          max_length: 250
          options: []
          required: false
          type: text-input
          variable: lever_companies
          default: voleon, levelai, weekdayworks, omnidian, zimperium, spotify, palantir
        - label: Ashby Companies (from companies.yaml)
          max_length: 350
          options: []
          required: false
          type: text-input
          variable: ashby_companies
          default: openai, ramp, linear, vanta, aiprise, collinear-ai, build-ai, genera,
            avoca, spector-ai, supabase, notion, replit, docker, posthog, cursor,
            elevenlabs
        - label: Target Locations (from config.yaml)
          max_length: 150
          options: []
          required: false
          type: text-input
          variable: target_location
          default: bangalore, bengaluru, pune, hyderabad, india
        - label: Target Keywords / Roles (from config.yaml)
          max_length: 150
          options: []
          required: false
          type: text-input
          variable: target_keywords
          default: sde, sde 1, software engineer, backend, full stack, junior, intern,
            associate
        - label: Run Mode
          max_length: 50
          options:
          - dry_run
          - production
          required: false
          type: select
          variable: run_mode
          default: dry_run
