    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        model:
          completion_params:
            temperature: 0.3
          mode: chat
          name: gpt-4o-mini
          provider: openai
        prompt_template:
        - id: prompt_draft_sys
          role: system
          text: "You prepare an application kit for jobs that scored >= 7.0.\nHard\
            \ rule: NEVER invent experience. Every claim must trace to candidate profile.\n\
            \nReturn a JSON array of drafted kits:\n[{\n  \"job_id\": \"...\",\n \
            \ \"fit_summary\": \"2 sentences why this is worth time\",\n  \"tailored_bullets\"\
            : [\"bullet 1 with metrics\", \"bullet 2 with metrics\"],\n  \"gaps\"\
            : [\"honest gap and how to address it\"],\n  \"cover_note\": \"120-160\
            \ words, direct, no generic 'I am writing to express my interest' filler\"\
            ,\n  \"questions_to_ask\": [\"sharp question 1\", \"sharp question 2\"\
            ]\n}]\n"
        - id: prompt_draft_user
          role: user
          text: 'CANDIDATE PROFILE:

            {{#env.CANDIDATE_PROFILE#}}


            SCREENING SCORES:

            {{#screen_llm.text#}}


            JOB DETAILS:

            {{#prefilter_code.candidate_jobs#}}

            '
        selected: false
        title: Tailored Application Drafting
        type: llm
        vision:
          enabled: false
      height: 98
      id: draft_llm
      position:
        x: 2480
        y: 280
      positionAbsolute:
        x: 2480
        y: 280
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\nimport re\n\ndef extract_json(raw):\n    if not raw:\n\
          \        return []\n    if isinstance(raw, (list, dict)):\n        return\
          \ raw\n    text = str(raw).strip()\n    text = re.sub(r\"^```(?:json)?\\\
          s*\", \"\", text, flags=re.I)\n    text = re.sub(r\"\\s*```$\", \"\", text)\n\
          \    m = re.search(r\"(\\[[\\s\\S]*\\]|\\{[\\s\\S]*\\})\", text)\n    if\
          \ m:\n        text = m.group(1)\n    try:\n        return json.loads(text)\n\
          \    except Exception:\n        return []\n\ndef main(screen_raw: str, draft_raw:\
          \ str, candidate_jobs_json: str, run_mode: str = \"dry_run\") -> dict:\n\
          \    scores = {}\n    s_data = extract_json(screen_raw)\n    if isinstance(s_data,\
          \ list):\n        for item in s_data:\n            if isinstance(item, dict)\
          \ and item.get(\"job_id\"):\n                scores[str(item.get(\"job_id\"\
          ))] = item\n    elif isinstance(s_data, dict):\n        for v in s_data.values():\n\
          \            if isinstance(v, list):\n                for item in v:\n \
          \                   if isinstance(item, dict) and item.get(\"job_id\"):\n\
          \                        scores[str(item.get(\"job_id\"))] = item\n\n  \
          \  drafts = {}\n    d_data = extract_json(draft_raw)\n    if isinstance(d_data,\
          \ list):\n        for item in d_data:\n            if isinstance(item, dict)\
          \ and item.get(\"job_id\"):\n                drafts[str(item.get(\"job_id\"\
          ))] = item\n    elif isinstance(d_data, dict):\n        for v in d_data.values():\n\
          \            if isinstance(v, list):\n                for item in v:\n \
          \                   if isinstance(item, dict) and item.get(\"job_id\"):\n\
          \                        drafts[str(item.get(\"job_id\"))] = item\n\n  \
          \  jobs = []\n    j_data = extract_json(candidate_jobs_json)\n    if isinstance(j_data,\
          \ list):\n        jobs = j_data\n\n    is_dry_run = (str(run_mode).lower()\
          \ != \"production\")\n    status_label = \"\U0001F680 Applied (Dry Run)\"\
          \ if is_dry_run else \"✅ Applied\"\n\n    MIN_SCORE_THRESHOLD = 6.0\n  \
          \  md_cards = []\n    applied_roles = []\n    top_job_id = \"\"\n    top_job_url\
          \ = \"\"\n    top_cover_note = \"\"\n\n    # Sort candidates by score descending\n\
          \    scored = []\n    for job in jobs:\n        jid = str(job.get(\"job_id\"\
          ) or \"\")\n        jid_suffix = jid.split(\":\")[-1] if \":\" in jid else\
          \ jid\n        score_info = scores.get(jid) or scores.get(jid_suffix) or\
          \ {}\n        score = float(score_info.get(\"score\") or 0)\n        reason\
          \ = score_info.get(\"reason\") or \"Evaluated match\"\n        draft = drafts.get(jid)\
          \ or drafts.get(jid_suffix) or {}\n        scored.append((score, job, reason,\
          \ draft))\n\n    scored.sort(key=lambda x: x[0], reverse=True)\n\n    for\
          \ score, job, reason, draft in scored:\n        # Strict threshold check:\
          \ Only include roles that passed the screening check!\n        if score\
          \ < MIN_SCORE_THRESHOLD:\n            continue\n\n        jid = str(job.get(\"\
          job_id\") or \"\")\n        source = job.get(\"source\", \"ATS\")\n    \
          \    title = job.get(\"title\", \"\")\n        company = job.get(\"company\"\
          , \"\")\n        location = job.get(\"location\", \"\")\n        url = job.get(\"\
          url\", \"\")\n        cover_note = draft.get(\"cover_note\", \"\")\n\n \
          \       applied_roles.append({\n            \"job_id\": jid,\n         \
          \   \"company\": company,\n            \"title\": title,\n            \"\
          url\": url,\n            \"score\": score\n        })\n\n        card_md\
          \ = f\"### [{score:g}/10] {status_label}: {title} @ {company}\\n\"\n   \
          \     card_md += f\"- **Platform**: {source}\\n\"\n        card_md += f\"\
          - **Location**: {location}\\n\"\n        card_md += f\"- **URL**: {url}\\\
          n\"\n        card_md += f\"- **Match Reason**: {reason}\\n\"\n        if\
          \ cover_note:\n            card_md += f\"\\n**Tailored Application Note**:\\\
          n> {cover_note}\\n\"\n        md_cards.append(card_md)\n\n        if not\
          \ top_job_id and score >= 7.0:\n            top_job_id = jid\n         \
          \   top_job_url = url\n            top_cover_note = cover_note\n\n    if\
          \ md_cards:\n        header = f\"# \U0001F99E JobHunt Applied Roles Digest\
          \ ({len(md_cards)} Matched Roles for Fresher / 0-1 YOE)\\n\\n\"\n      \
          \  markdown_digest = header + \"\\n---\\n\".join(md_cards)\n    else:\n\
          \        markdown_digest = (\n            \"# \U0001F99E JobHunt Digest:\
          \ No High-Scoring Matches Today\\n\\n\"\n            f\"Screened {len(jobs)}\
          \ candidate postings across ATS, LinkedIn, and X. \"\n            f\"All\
          \ roles scored below the {MIN_SCORE_THRESHOLD}/10 threshold (e.g. senior\
          \ requirements demanding 3+ years experience, \"\n            \"or non-engineering\
          \ operations roles). No applications were submitted to protect your application\
          \ history.\"\n        )\n\n    apply_payload = {\n        \"job_id\": top_job_id\
          \ or (applied_roles[0][\"job_id\"] if applied_roles else \"job:none\"),\n\
          \        \"url\": top_job_url or (applied_roles[0][\"url\"] if applied_roles\
          \ else \"https://jobs.example.com\"),\n        \"cover_letter\": top_cover_note\
          \ or \"I am excited to apply for this entry-level / SDE 1 engineering role.\"\
          ,\n        \"dry_run\": is_dry_run\n    }\n\n    return {\n        \"digest_markdown\"\
          : markdown_digest,\n        \"top_count\": len(applied_roles),\n       \
          \ \"applied_roles_json\": json.dumps(applied_roles),\n        \"apply_payload_json\"\
          : json.dumps(apply_payload)\n    }\n"
