# jobhunt configuration. Everything tunable lives here — no editing Python.
#
# Tune `filters` first. It is deterministic, free, and it is what keeps the
# LLM bill small: roughly 2000 raw postings -> 40 candidates before a single
# token is spent.

filters:
  # Title regexes, matched case-insensitively against the job title only.
  # Tuned for Fresher / 0-1 Year Experience (Intern, Junior, Associate, SDE-1, Full-Stack, Backend).
  include_titles:
    - '\b(software|backend|back-end|full[- ]?stack|server|platform|infrastructure|infra|systems|distributed|cloud|api)\b.*\b(engineer|developer)\b'
    - '\b(engineer|developer)\b.*\b(backend|back-end|full[- ]?stack|platform|infrastructure|infra|systems|distributed|cloud|api|networking)\b'
    - '\bsde\b'
    - '\bsde\s*-?\s*(i{1,3}|[123])\b'
    - 'software development engineer'
    - 'software engineer'
    - 'full[- ]?stack engineer'
    - 'backend engineer'
    - 'site reliability engineer'
    - '\bsre\b'
    - '\b(intern|internship|trainee|apprentice|graduate|fresher|junior|associate)\b'
    - '\bmember of technical staff\b'

  # Anything matching these is dropped even if an include matched.
  exclude_titles:
    # Senior / Staff / Leadership roles (too senior for 0-1 YOE)
    - '\b(staff|principal|distinguished|fellow|architect)\b'
    - '\b(sr\.?|senior)\b'
    - '\b(director|vp|vice president|head of|chief|cto)\b'
    - '\b(manager|management)\b'
    - '\blead\b'
    # Non-engineering / Operations / HR / Sales / Admin roles
    - '\b(people operations|human resources|\bhr\b|talent|recruiter|sourcer|recruiting)\b'
    - '\b(administrator|admin|sysadmin|systems admin)\b'
    - '\b(operations|associate operations)\b'
    - '\b(sales|account executive|marketing|finance|payroll|accounting|legal|compliance|procurement|counsel|attorney|lawyer)\b'
    - '\b(customer support|tech support|desktop support|helpdesk)\b'
    - '\b(data scientist|machine learning scientist|research scientist)\b'
    - '\b(frontend|front-end|ios|android|mobile|game|designer)\b'

  # Substrings matched against "<location> <title>", case-insensitive.
  # Leave empty to accept every location.
  locations:
    - bangalore
    - bengaluru
    - pune 
    - hyderabad
    - india

  # If true, anything reading as remote passes the location gate.
  allow_remote: true

  # Drop postings older than this. Set to null to disable.
  # Boards often re-stamp `updated_at`, so this is a soft signal, not a promise.
  max_age_days: 15

# --- LLM stages -------------------------------------------------------------
screen_batch_size: 8      # jobs per screening call. Higher = cheaper, sloppier.
screen_jd_chars: 1400     # JD truncation for screening
draft_jd_chars: 6000      # JD truncation for drafting
score_threshold: 7.0      # below this, no draft and no digest slot
max_per_digest: 10         # hard cap on expensive draft calls per run

# --- paths ------------------------------------------------------------------
companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv
