services:
  jobhunt-bridge:
    build: .
    container_name: jobhunt-bridge
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./out:/app/out
      - ./config.yaml:/app/config.yaml:ro
      - ./companies.yaml:/app/companies.yaml:ro
      - ./profile.json:/app/profile.json:ro
